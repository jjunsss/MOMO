<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Colab step 3: select GPU and save</title>
  <desc id="desc">A screenshot-style guide showing the runtime type dialog with T4 GPU selected and Save highlighted.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#2563eb"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.22"/>
    </filter>
  </defs>
  <rect width="1200" height="760" fill="#f8fafc"/>
  <rect x="70" y="66" width="1060" height="600" rx="18" fill="#ffffff" stroke="#e2e8f0"/>
  <rect x="70" y="66" width="1060" height="70" rx="18" fill="#eef2f7"/>
  <text x="110" y="112" font-family="Arial, Noto Sans KR, sans-serif" font-size="24" font-weight="700" fill="#334155">MOMO Colab Quick Trial</text>
  <rect x="330" y="170" width="540" height="392" rx="20" fill="#ffffff" stroke="#cbd5e1" filter="url(#shadow)"/>
  <text x="374" y="224" font-family="Arial, Noto Sans KR, sans-serif" font-size="26" font-weight="700" fill="#0f172a">Change runtime type</text>
  <text x="374" y="278" font-family="Arial, Noto Sans KR, sans-serif" font-size="17" font-weight="700" fill="#334155">Runtime type</text>
  <rect x="560" y="254" width="250" height="44" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="584" y="282" font-family="Arial, Noto Sans KR, sans-serif" font-size="17" fill="#334155">Python 3</text>
  <text x="374" y="350" font-family="Arial, Noto Sans KR, sans-serif" font-size="17" font-weight="700" fill="#334155">Hardware accelerator</text>
  <rect x="560" y="326" width="250" height="48" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/>
  <text x="584" y="356" font-family="Arial, Noto Sans KR, sans-serif" font-size="18" font-weight="700" fill="#1d4ed8">T4 GPU / GPU</text>
  <path d="M782 350 L800 340 L800 360 Z" fill="#1d4ed8"/>
  <text x="374" y="414" font-family="Arial, Noto Sans KR, sans-serif" font-size="15" fill="#64748b">If T4 GPU is unavailable, choose any available GPU option.</text>
  <rect x="592" y="486" width="104" height="48" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="624" y="517" font-family="Arial, Noto Sans KR, sans-serif" font-size="17" fill="#334155">Cancel</text>
  <rect x="714" y="486" width="104" height="48" rx="10" fill="#2563eb"/>
  <text x="750" y="517" font-family="Arial, Noto Sans KR, sans-serif" font-size="17" font-weight="700" fill="#ffffff">Save</text>
  <path d="M930 328 C890 340 852 348 816 350" fill="none" stroke="#2563eb" stroke-width="6" marker-end="url(#arrow)"/>
  <path d="M930 516 C890 514 852 512 820 510" fill="none" stroke="#2563eb" stroke-width="6" marker-end="url(#arrow)"/>
  <rect x="880" y="210" width="270" height="144" rx="18" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/>
  <text x="910" y="252" font-family="Arial, Noto Sans KR, sans-serif" font-size="24" font-weight="700" fill="#1d4ed8">3. GPU 선택</text>
  <text x="910" y="288" font-family="Arial, Noto Sans KR, sans-serif" font-size="18" fill="#1e3a8a">T4 GPU 또는 GPU를 선택</text>
  <text x="910" y="322" font-family="Arial, Noto Sans KR, sans-serif" font-size="16" fill="#475569">Select T4 GPU or GPU.</text>
  <rect x="880" y="436" width="270" height="120" rx="18" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/>
  <text x="910" y="478" font-family="Arial, Noto Sans KR, sans-serif" font-size="24" font-weight="700" fill="#1d4ed8">4. Save 클릭</text>
  <text x="910" y="516" font-family="Arial, Noto Sans KR, sans-serif" font-size="16" fill="#475569">Click Save to apply.</text>
</svg>
