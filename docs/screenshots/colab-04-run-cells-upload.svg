<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Colab step 4: run cells and upload recording</title>
  <desc id="desc">A screenshot-style guide showing Colab play buttons and the upload recording step.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#2563eb"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.16"/>
    </filter>
  </defs>
  <rect width="1200" height="760" fill="#f8fafc"/>
  <rect x="58" y="50" width="1084" height="646" rx="18" fill="#ffffff" filter="url(#shadow)"/>
  <text x="96" y="104" font-family="Arial, Noto Sans KR, sans-serif" font-size="28" font-weight="700" fill="#f59e0b">MOMO Colab Quick Trial</text>
  <g>
    <rect x="96" y="144" width="674" height="92" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
    <circle cx="132" cy="190" r="18" fill="#2563eb"/>
    <path d="M128 179 L128 201 L146 190 Z" fill="#ffffff"/>
    <text x="174" y="184" font-family="Arial, Noto Sans KR, sans-serif" font-size="19" font-weight="700" fill="#0f172a">1. Settings / 설정</text>
    <text x="174" y="212" font-family="Arial, Noto Sans KR, sans-serif" font-size="15" fill="#64748b">Run this cell first.</text>
  </g>
  <g>
    <rect x="96" y="260" width="674" height="92" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
    <circle cx="132" cy="306" r="18" fill="#2563eb"/>
    <path d="M128 295 L128 317 L146 306 Z" fill="#ffffff"/>
    <text x="174" y="300" font-family="Arial, Noto Sans KR, sans-serif" font-size="19" font-weight="700" fill="#0f172a">2. GPU check / GPU 확인</text>
    <text x="174" y="328" font-family="Arial, Noto Sans KR, sans-serif" font-size="15" fill="#64748b">If this fails, change runtime type to GPU.</text>
  </g>
  <g>
    <rect x="96" y="376" width="674" height="92" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
    <circle cx="132" cy="422" r="18" fill="#2563eb"/>
    <path d="M128 411 L128 433 L146 422 Z" fill="#ffffff"/>
    <text x="174" y="416" font-family="Arial, Noto Sans KR, sans-serif" font-size="19" font-weight="700" fill="#0f172a">3. Install MOMO / MOMO 설치</text>
    <text x="174" y="444" font-family="Arial, Noto Sans KR, sans-serif" font-size="15" fill="#64748b">First run downloads packages and models.</text>
  </g>
  <g>
    <rect x="96" y="492" width="674" height="92" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
    <circle cx="132" cy="538" r="18" fill="#2563eb"/>
    <path d="M128 527 L128 549 L146 538 Z" fill="#ffffff"/>
    <text x="174" y="532" font-family="Arial, Noto Sans KR, sans-serif" font-size="19" font-weight="700" fill="#0f172a">5. Upload a recording / 녹화 파일 업로드</text>
    <text x="174" y="560" font-family="Arial, Noto Sans KR, sans-serif" font-size="15" fill="#64748b">Choose one meeting file when the upload button appears.</text>
  </g>
  <rect x="812" y="156" width="292" height="180" rx="18" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/>
  <text x="842" y="204" font-family="Arial, Noto Sans KR, sans-serif" font-size="25" font-weight="700" fill="#1d4ed8">위에서 아래로 실행</text>
  <text x="842" y="242" font-family="Arial, Noto Sans KR, sans-serif" font-size="18" fill="#1e3a8a">각 셀 왼쪽 ▶ 버튼을</text>
  <text x="842" y="270" font-family="Arial, Noto Sans KR, sans-serif" font-size="18" fill="#1e3a8a">하나씩 누르세요.</text>
  <text x="842" y="308" font-family="Arial, Noto Sans KR, sans-serif" font-size="16" fill="#475569">Run cells from top to bottom.</text>
  <path d="M808 248 C705 224 582 198 150 190" fill="none" stroke="#2563eb" stroke-width="6" marker-end="url(#arrow)"/>
  <rect x="812" y="412" width="292" height="154" rx="18" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/>
  <text x="842" y="458" font-family="Arial, Noto Sans KR, sans-serif" font-size="25" font-weight="700" fill="#1d4ed8">파일 업로드</text>
  <text x="842" y="496" font-family="Arial, Noto Sans KR, sans-serif" font-size="18" fill="#1e3a8a">Upload 버튼이 뜨면</text>
  <text x="842" y="524" font-family="Arial, Noto Sans KR, sans-serif" font-size="18" fill="#1e3a8a">회의 파일을 선택하세요.</text>
  <text x="842" y="562" font-family="Arial, Noto Sans KR, sans-serif" font-size="16" fill="#475569">Pick your recording file.</text>
  <path d="M808 488 C674 516 428 538 150 538" fill="none" stroke="#2563eb" stroke-width="6" marker-end="url(#arrow)"/>
</svg>
